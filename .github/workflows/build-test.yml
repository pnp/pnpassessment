name: Build and test

on:
  push:
    branches:
      - main
      - release/1.16.1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      # PnP.Scanning references the PnP Core SDK projects via relative paths that expect
      # the pnpcore repo to sit as a SIBLING of pnpassessment (..\..\..\..\pnpcore\...).
      # Both repos are therefore checked out side by side under the workspace root.
      - name: Checkout pnpassessment
        uses: actions/checkout@v4
        with:
          path: pnpassessment

      # Keep this patch branch on the verified official PnP Core SDK 1.16.0.
      # Do not resolve latest or fall back to a moving development branch.

      - name: Checkout pnpcore (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: pnp/pnpcore
          ref: f7a374bed313daa2cef676bec06413924dae32a1 # 1.16.0
          path: pnpcore

      # The application/tests target net8.0; the SDK source also declares net10.0.
      - name: Setup .NET 8 runtime and .NET 10 build SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore pnpassessment/src/PnP.Scanning/PnP.Scanning.Core.Tests/PnP.Scanning.Core.Tests.csproj

      - name: Test
        run: dotnet test pnpassessment/src/PnP.Scanning/PnP.Scanning.Core.Tests/PnP.Scanning.Core.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: pnpassessment/**/TestResults/*.trx
          if-no-files-found: ignore
