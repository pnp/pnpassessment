name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      # PnP.Scanning references the PnP Core SDK projects via relative paths that expect
      # the pnpcore repo to sit as a SIBLING of pnpassessment (..\..\..\..\pnpcore\...).
      # Both repos are therefore checked out side by side under the workspace root.
      - name: Checkout pnpassessment
        uses: actions/checkout@v4
        with:
          path: pnpassessment

      - name: Checkout pnpcore (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: pnp/pnpcore
          # PnP Core 1.18.0. Use the immutable commit rather than a moving
          # latest-release lookup so restore and tests remain reproducible.
          ref: 1f07296b186698c3cc9ca8580f00af36c0f3f4f5
          path: pnpcore

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: pnpassessment/global.json

      - name: Restore
        working-directory: pnpassessment
        run: dotnet restore src/PnP.Scanning/PnP.Scanning.Core.Tests/PnP.Scanning.Core.Tests.csproj -p:TargetFramework=net8.0

      - name: Test
        working-directory: pnpassessment
        run: dotnet test src/PnP.Scanning/PnP.Scanning.Core.Tests/PnP.Scanning.Core.Tests.csproj --framework net8.0 --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: pnpassessment/**/TestResults/*.trx
          if-no-files-found: ignore
